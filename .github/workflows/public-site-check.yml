name: Public website availability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public pages and assets without authentication
        shell: bash
        run: |
          set -euo pipefail
          base='https://onazioj179-lab.github.io/'
          paths=(
            ''
            'index.html'
            'privacy.html'
            'cookies.html'
            'terms.html'
            'styles.css'
            'site.js'
            'assets/fonts/archivo-latin.woff2'
            'assets/fonts/inter-latin.woff2'
          )
          for page in "${paths[@]}"; do
            status=$(curl --fail --silent --show-error --location --max-time 30 --retry 2 --retry-delay 2 --output /dev/null --write-out '%{http_code}' "${base}${page}")
            test "$status" = '200'
            printf 'PASS %s (HTTP %s)\n' "${base}${page}" "$status"
          done
      - name: Confirm self-contained static HTML
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/static-home.html"
          curl --fail --silent --show-error --location --max-time 30 --retry 2 --output "$page" 'https://onazioj179-lab.github.io/'
          grep -q '<style id="site-styles">' "$page"
          grep -q '<form id="enquiryForm" action="https://wa.me/2348164043196" method="get">' "$page"
          ! grep -Eq '<script[^>]* src=|<link[^>]*rel="stylesheet"' "$page"
          printf 'PASS static HTML: inline styles, native enquiry form, no required external scripts or stylesheet\n'
