<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <title>Page not found — Onazi’s Import</title>
  <style id="site-styles">
@font-face{font-family:Archivo;font-style:normal;font-weight:400 900;font-display:swap;src:url('/assets/fonts/archivo-latin.woff2') format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:400 600;font-display:swap;src:url('/assets/fonts/inter-latin.woff2') format('woff2')}

:root{
  --black:#0a0a0a;
  --white:#ffffff;
  --off:#f5f5f4;
  --grey:#6e6e73;
  --line:#e5e5e5;
  --line-dark:#1f1f1f;
  --r-sm:10px;
  --r-md:16px;
  --r-lg:22px;
  --r-pill:999px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--white);color:var(--black);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Archivo',sans-serif}
a{color:inherit}
::selection{background:var(--black);color:var(--white)}
img{max-width:100%}

/* ============ NAV ============ */
nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(255,255,255,.86);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1440px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px}
.brand{font-family:'Archivo';font-weight:900;font-size:1.05rem;letter-spacing:.18em;text-decoration:none;text-transform:uppercase}
.nav-links{display:flex;gap:40px;list-style:none}
.nav-links a{text-decoration:none;font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--black);opacity:.6;transition:opacity .25s}
.nav-links a:hover{opacity:1}
.nav-call{text-decoration:none;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--black);padding:11px 24px;transition:.3s;white-space:nowrap;border-radius:var(--r-pill)}
.nav-call:hover{background:var(--black);color:var(--white);transform:translateY(-1px)}
.burger{display:none;background:none;border:0;cursor:pointer;flex-direction:column;gap:6px;padding:8px}
.burger span{width:26px;height:1.5px;background:var(--black);transition:.3s}
.burger.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
@media(max-width:900px){
  .nav-inner{padding:0 20px}
  .nav-links{position:fixed;inset:64px 0 auto 0;background:var(--white);flex-direction:column;gap:0;padding:0;max-height:0;overflow:hidden;transition:max-height .4s ease;border-bottom:0 solid var(--line)}
  .nav-links.open{max-height:480px;border-bottom-width:1px}
  .nav-links li{border-top:1px solid var(--line)}
  .nav-links a{display:block;padding:20px;opacity:1;font-size:.8rem}
  .nav-call{display:none}
  .burger{display:flex}
}

/* ============ HERO ============ */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:140px 40px 80px;max-width:1440px;margin:auto}
.hero .kicker{font-size:.72rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);margin-bottom:28px}
.hero h1{font-weight:900;font-size:clamp(3rem,11vw,9.5rem);line-height:.92;letter-spacing:-.02em;text-transform:uppercase}
.hero h1 .outline{color:transparent;-webkit-text-stroke:1.5px var(--black)}
.hero-sub{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-top:56px;flex-wrap:wrap}
.hero-sub p{max-width:480px;color:var(--grey);font-size:1rem}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-family:'Archivo';font-weight:700;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;padding:18px 40px;transition:transform .3s,background .3s,color .3s,box-shadow .3s;border:1px solid var(--black);border-radius:var(--r-pill)}
.btn-solid{background:var(--black);color:var(--white)}
.btn-solid:hover{background:var(--white);color:var(--black);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.14)}
.btn-line{background:transparent;color:var(--black)}
.btn-line:hover{background:var(--black);color:var(--white);transform:translateY(-2px)}
@media(max-width:900px){.hero{padding:120px 20px 60px}}

/* ============ MARQUEE ============ */
.marquee{border-top:1px solid var(--black);border-bottom:1px solid var(--black);overflow:hidden;padding:18px 0;background:var(--white)}
.marquee-track{display:flex;gap:64px;white-space:nowrap;width:max-content}
html[data-motion="playing"] .marquee-track{animation:scroll 28s linear infinite}
.marquee-track span{font-family:'Archivo';font-weight:800;font-size:.82rem;letter-spacing:.28em;text-transform:uppercase}
.marquee-track i{font-style:normal;color:var(--grey)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* ============ IMPORT JOURNEY ============ */
.flightpath{width:100%;height:auto;display:block;overflow:visible;margin-top:8px}
.fp-line{fill:none;stroke:#d6d6d6;stroke-width:2;stroke-dasharray:1 10;stroke-linecap:round}
.fp-dot{fill:#0a0a0a}
.fp-ring{fill:none;stroke:#0a0a0a;stroke-width:2}
.fp-label{font-family:'Archivo',sans-serif;font-weight:800;font-size:20px;letter-spacing:2px;fill:#0a0a0a}
.fp-sub{font-family:'Inter',sans-serif;font-weight:500;font-size:13px;fill:#8a8a8a;letter-spacing:1px}
.plane path{fill:#0a0a0a}
.plane{display:none}
html[data-motion="playing"] .plane{display:inline}
.stops{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:40px}
.stop{padding:42px 34px;border-right:1px solid var(--line);transition:background .35s,color .35s}
.stop:last-child{border-right:0}
.stop:hover{background:var(--black);color:#fff}
.stop .s-step{font-family:'Archivo';font-weight:600;font-size:.7rem;letter-spacing:.25em;color:var(--grey);text-transform:uppercase}
.stop svg.s-ic{width:40px;height:40px;stroke:currentColor;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round;margin:24px 0 18px;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.stop:hover svg.s-ic{transform:translateY(-4px) scale(1.06)}
.stop h3{font-weight:800;font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.stop p{font-size:.86rem;color:var(--grey);transition:color .35s}
.stop:hover p{color:#b8b8b8}
@media(max-width:760px){
  .stops{grid-template-columns:1fr}
  .stop{border-right:0;border-bottom:1px solid var(--line)}
  .stop:last-child{border-bottom:0}
  .fp-label{font-size:26px}
  .fp-sub{font-size:17px}
}
@media(prefers-reduced-motion:reduce){html:not([data-motion="playing"]) .plane{display:none}}

/* ============ SECTION SHELL ============ */
section{padding:120px 40px;max-width:1440px;margin:auto}
@media(max-width:900px){section{padding:80px 20px}}
.sec-label{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--black);padding-bottom:20px;margin-bottom:64px;gap:20px;flex-wrap:wrap}
.sec-label h2{font-weight:900;font-size:clamp(1.8rem,4.5vw,3.4rem);text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.sec-label .idx{font-family:'Archivo';font-weight:600;font-size:.74rem;letter-spacing:.3em;color:var(--grey);text-transform:uppercase}

/* ============ CATEGORIES ============ */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
@media(max-width:1100px){.cat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.cat-grid{grid-template-columns:1fr}}
.cat{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:48px 32px 40px;position:relative;transition:background .35s,color .35s;min-height:300px;display:flex;flex-direction:column}
.cat:hover{background:var(--black);color:var(--white)}
.cat svg:not(.arrow){transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.cat:hover svg:not(.arrow){transform:translateY(-4px) scale(1.06)}
.cat .num{font-family:'Archivo';font-weight:600;font-size:.7rem;letter-spacing:.25em;color:var(--grey);margin-bottom:auto}
.cat svg{width:34px;height:34px;stroke:currentColor;stroke-width:1.4;fill:none;margin:28px 0 20px;stroke-linecap:round;stroke-linejoin:round}
.cat h3{font-weight:800;font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.cat p{font-size:.84rem;color:var(--grey);transition:color .35s}
.cat:hover p{color:#b8b8b8}
.cat .arrow{position:absolute;top:44px;right:32px;width:18px;height:18px;stroke:currentColor;stroke-width:1.5;fill:none;opacity:0;transform:translate(-8px,8px);transition:.35s;margin:0}
.cat:hover .arrow{opacity:1;transform:none}

/* ============ WHY — BLACK SECTION ============ */
.dark{background:var(--black);color:var(--white)}
.dark-inner{max-width:1440px;margin:auto;padding:120px 40px}
@media(max-width:900px){.dark-inner{padding:80px 20px}}
.dark .sec-label{border-color:var(--white)}
.dark .sec-label .idx{color:#8a8a8a}
.why-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid var(--line-dark);border-radius:var(--r-lg);overflow:hidden}
.why-item{transition:background .35s}
.why-item:hover{background:#141414}
@media(max-width:1000px){.why-list{grid-template-columns:1fr}}
.why-item{padding:48px 36px;border-bottom:1px solid var(--line-dark)}
.why-item:nth-child(3n+2){border-left:1px solid var(--line-dark);border-right:1px solid var(--line-dark)}
@media(max-width:1000px){.why-item:nth-child(3n+2){border-left:0;border-right:0}}
.why-item .w-num{font-family:'Archivo';font-weight:900;font-size:2.6rem;line-height:1;color:transparent;-webkit-text-stroke:1px #555;margin-bottom:24px}
.why-item h3{font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.why-item p{font-size:.88rem;color:#9a9a9a}

/* ============ STATEMENT ============ */
.statement{text-align:left}
.statement p{font-family:'Archivo';font-weight:800;font-size:clamp(1.6rem,4.4vw,3.6rem);line-height:1.15;text-transform:uppercase;letter-spacing:-.01em;max-width:1100px}
.statement p span{color:transparent;-webkit-text-stroke:1.2px var(--black)}

/* ============ WHOLESALE ============ */
.ws{display:grid;grid-template-columns:1.2fr 1fr;gap:64px;align-items:center}
@media(max-width:900px){.ws{grid-template-columns:1fr}}
.ws h2{font-weight:900;font-size:clamp(2rem,5vw,3.8rem);text-transform:uppercase;line-height:1.02;letter-spacing:-.01em;margin-bottom:24px}
.ws p{color:var(--grey);max-width:480px;margin-bottom:36px}
.ws-points{list-style:none;border-top:1px solid var(--line)}
.ws-points li{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);font-family:'Archivo';font-weight:700;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase}
.ws-points li span{color:var(--grey);font-family:'Inter';font-weight:500;font-size:.78rem;letter-spacing:0;text-transform:none}

/* ============ CONTACT — BLACK ============ */
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line-dark);border-radius:var(--r-lg);overflow:hidden}
@media(max-width:900px){.contact-grid{grid-template-columns:1fr}}
.c-cell{padding:48px 36px;border-bottom:1px solid var(--line-dark)}
.c-cell:nth-child(2){border-left:1px solid var(--line-dark);border-right:1px solid var(--line-dark)}
@media(max-width:900px){.c-cell:nth-child(2){border-left:0;border-right:0}}
.c-cell .c-label{font-size:.68rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#8a8a8a;margin-bottom:18px}
.c-cell .c-value{font-family:'Archivo';font-weight:800;font-size:1.3rem;line-height:1.3;text-transform:uppercase}
.c-cell .c-value a{text-decoration:none;border-bottom:1px solid var(--white);transition:.25s}
.c-cell .c-value a:hover{color:#b8b8b8;border-color:#b8b8b8}
.c-cell .c-sub{font-size:.84rem;color:#9a9a9a;margin-top:10px}
.big-call{margin-top:80px;text-align:center}
.big-call a{font-family:'Archivo';font-weight:900;font-size:clamp(2.2rem,8vw,6.5rem);letter-spacing:.02em;text-decoration:none;line-height:1;display:inline-block;border-bottom:3px solid var(--white);padding-bottom:10px;transition:.3s}
.big-call a:hover{color:transparent;-webkit-text-stroke:1.5px var(--white)}
.ws-points{border-radius:var(--r-md);overflow:hidden}
.big-call .hint{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:#8a8a8a;margin-top:22px}

/* ============ FOOTER ============ */
footer{background:var(--black);color:var(--white);border-top:1px solid var(--line-dark)}
.f-inner{max-width:1440px;margin:auto;padding:80px 40px 0}
@media(max-width:900px){.f-inner{padding:60px 20px 0}}
.f-top{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:48px;padding-bottom:64px}
@media(max-width:1000px){.f-top{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.f-top{grid-template-columns:1fr}}
.f-brand .brand{font-size:1.2rem;color:var(--white)}
.f-brand p{color:#9a9a9a;font-size:.86rem;margin-top:18px;max-width:300px}
.f-col h4{font-size:.68rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#8a8a8a;margin-bottom:22px}
.f-col ul{list-style:none}
.f-col li{margin-bottom:13px}
.f-col a{color:var(--white);text-decoration:none;font-size:.88rem;opacity:.85;transition:.25s}
.f-col a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.f-col .addr{color:#9a9a9a;font-size:.88rem;line-height:1.7}
.f-wordmark{border-top:1px solid var(--line-dark);padding:48px 0 32px;overflow:hidden}
.f-wordmark span{display:block;font-family:'Archivo';font-weight:900;font-size:clamp(2.4rem,9.5vw,9rem);line-height:.95;letter-spacing:-.02em;text-transform:uppercase;color:transparent;-webkit-text-stroke:1px #3a3a3a;white-space:nowrap;text-align:center}
.f-team{border-top:1px solid var(--line-dark);display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-dark);border-radius:var(--r-md);overflow:hidden;margin-bottom:0}
@media(max-width:900px){.f-team{grid-template-columns:repeat(2,1fr)}}
.team-cell{background:var(--black);padding:26px 28px;text-align:center;transition:background .3s}
.team-cell:hover{background:#141414}
.team-cell .t-role{display:block;font-size:.62rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#8a8a8a;margin-bottom:9px}
.team-cell .t-name{display:block;font-family:'Archivo';font-weight:800;font-size:1.05rem;letter-spacing:.02em;text-transform:uppercase}
@media(max-width:680px){.f-team{grid-template-columns:1fr}}
.f-bottom{border-top:1px solid var(--line-dark);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 0 32px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#8a8a8a;margin-top:28px}
.f-bottom a{color:#8a8a8a;text-decoration:none}
.f-bottom a:hover{color:var(--white)}

/* ============ REVEAL ============ */
.reveal{opacity:1;transform:none}
.reveal.animate{opacity:1;transform:none}
.reveal.animate.in{animation:section-in .7s cubic-bezier(.2,.6,.2,1)}
@keyframes section-in{from{opacity:.35;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ============ NAV SCROLL STATE ============ */
nav.scrolled{box-shadow:0 6px 30px rgba(0,0,0,.08)}

/* ============ MOBILE POLISH ============ */
@media(max-width:600px){
  .hero h1 .outline{font-size:.74em;letter-spacing:-.035em;white-space:nowrap;display:inline-block}
  .hero{padding:108px 18px 56px;min-height:auto}
  .hero h1{font-size:clamp(2.6rem,15vw,4rem)}
  .hero-sub{margin-top:40px;gap:28px}
  .hero-cta{width:100%}
  .hero-cta .btn{flex:1;text-align:center;padding:16px 20px}
  section{padding:64px 18px}
  .dark-inner{padding:64px 18px}
  .sec-label{margin-bottom:40px;padding-bottom:16px}
  .sec-label .idx{font-size:.64rem}
  .cat{padding:34px 24px;min-height:240px}
  .why-item{padding:36px 26px}
  .c-cell{padding:36px 26px}
  .ws{gap:40px}
  .big-call{margin-top:56px}
  .big-call a{border-bottom-width:2px}
  .f-inner{padding:48px 18px 0}
  .f-top{gap:36px;padding-bottom:48px}
}
@media(hover:none){
  .btn-solid:hover{box-shadow:none;transform:none}
  .cat:hover svg:not(.arrow){transform:none}
}

/* Shared refinements and customer information */
[hidden]{display:none!important}
html{scroll-padding-top:88px}
body{overflow-wrap:break-word}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea,summary{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid currentColor;outline-offset:5px}
button{cursor:pointer}
button.btn{line-height:1.6}
.skip-link{position:fixed;left:20px;top:-100px;z-index:500;padding:12px 20px;background:var(--black);color:var(--white);border-radius:var(--r-pill)}
.skip-link:focus{top:12px}
nav:after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:var(--scroll-progress,0%);background:var(--black)}
.nav-links{gap:26px}
.nav-links a{position:relative}
.nav-links a:after{content:"";position:absolute;bottom:-7px;left:0;right:0;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav-links a:hover:after,.nav-links a:focus-visible:after{transform:scaleX(1)}
.hero-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;border-top:1px solid var(--line);padding-top:24px;margin-top:68px;font-size:.67rem;letter-spacing:.11em;text-transform:uppercase;color:var(--grey)}
.hero-meta a{text-decoration:none;color:var(--black)}
.hero-meta a span{display:inline-block;margin-left:12px}
.motion-bar{display:flex;justify-content:space-between;align-items:center;gap:20px;max-width:1440px;margin:auto;padding:16px 40px;font-size:.7rem;color:var(--grey)}
.text-button{background:none;border:0;color:inherit;padding:6px 0;font:inherit;text-decoration:underline;text-underline-offset:4px}
.marquee-track{gap:0}
.marquee-track span{padding-right:64px}
.marquee:hover .marquee-track{animation-play-state:paused}
.flightpath{overflow:hidden}
.cat{text-decoration:none}
.cat:focus-visible{outline-offset:-5px;background:var(--black);color:white}
.cat:focus-visible p{color:#b8b8b8}
.cat:focus-visible .arrow{opacity:1;transform:none}
.cat-grid .cat:nth-child(4n+2),.stops .stop:nth-child(2){transition-delay:.06s}
.cat-grid .cat:nth-child(4n+3),.stops .stop:nth-child(3){transition-delay:.12s}
.cat-grid .cat:nth-child(4n+4){transition-delay:.18s}
.section-intro{font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.6;max-width:420px;color:var(--grey)}
.order-layout{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}
.order-layout>*,.faq-layout>*,.ws>*,.f-top>*,.policy-layout>*{min-width:0}
.order-steps{list-style:none;margin:36px 0}
.order-steps li{display:flex;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)}
.order-steps li>span{font-family:Archivo,sans-serif;font-size:.72rem;color:var(--grey);padding-top:4px}
.order-steps h3{font-size:1rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.order-steps p{font-size:.88rem;color:var(--grey);max-width:390px}
.inline-link{text-underline-offset:5px;font-size:.86rem}
.enquiry-card{background:var(--off);padding:40px;border:1px solid var(--line);border-radius:var(--r-lg)}
.eyebrow{font-size:.66rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin-bottom:16px}
.enquiry-card h3{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;line-height:1.12;letter-spacing:-.02em;margin-bottom:18px}
.form-intro{font-size:.88rem;color:var(--grey);margin-bottom:28px}
form label{display:block;font-size:.78rem;font-weight:600;margin:20px 0 8px}
form label span{font-weight:400;color:var(--grey)}
input,select,textarea{display:block;width:100%;min-height:48px;border:1px solid #b5b5b5;border-radius:var(--r-sm);background:white;color:var(--black);padding:13px 14px;font-size:1rem}
textarea{resize:vertical}
.form-field{margin-top:26px}
.form-field:first-child{margin-top:0}
.form-field label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 10px;line-height:1.5}
.field-tag{font-size:.65rem;letter-spacing:.03em;white-space:nowrap}
.select-control{position:relative}
.select-control select{appearance:none;-webkit-appearance:none;padding-right:48px;cursor:pointer}
.select-control svg{position:absolute;right:16px;top:17px;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;pointer-events:none}
.quantity-control{display:flex;align-items:center;gap:10px}
.quantity-control input{min-width:0;text-align:center;flex:1;appearance:textfield;-moz-appearance:textfield}
.quantity-control input::-webkit-inner-spin-button,.quantity-control input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.quantity-control button{width:48px;min-height:48px;flex-shrink:0;display:grid;place-items:center;background:white;border:1px solid #aaa;border-radius:var(--r-sm);font-size:1.5rem;line-height:1}
.quantity-control button:hover:not(:disabled){background:var(--black);border-color:var(--black);color:white}
.quantity-control button:disabled{color:#999;background:#eee;border-color:#d4d4d4;cursor:default}
.field-hint{font-size:.74rem;line-height:1.65;color:#59595e;margin-top:8px}
.field-error{font-size:.75rem;font-weight:600;line-height:1.6;color:#a02525;margin-top:8px}
[aria-invalid="true"]{border-color:#a02525;box-shadow:0 0 0 1px #a02525}
.field-meta{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.character-count{font-size:.68rem;color:#59595e;white-space:nowrap}
.enquiry-fallback{margin-top:24px;border-top:1px solid #d4d4d4;padding-top:18px;font-size:.78rem;line-height:1.8;color:#59595e}
.enquiry-fallback a{text-underline-offset:4px}
.enquiry-options{border:0;padding:0;margin:0;min-width:0}
.enquiry-options:not([hidden])+.form-field{margin-top:26px}
.mobile-menu{display:none;border:0;padding:0}
.mobile-menu>summary{min-height:44px;padding:8px 16px;margin:0;border:1px solid var(--black);border-radius:var(--r-pill);font-size:.8rem;font-weight:600;line-height:1.5}
.mobile-menu>summary:after{content:none}
.mobile-links{position:fixed;top:64px;left:0;right:0;background:white;list-style:none;border-bottom:1px solid var(--line);max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);overflow-y:auto;overscroll-behavior:contain}
.mobile-links li{border-top:1px solid var(--line)}
.mobile-links a{display:block;text-decoration:none;padding:18px 20px;font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:900px){
  .mobile-menu{display:block}
  nav .nav-links{display:none}
  html:not(.nav-ready) .site-navigation .nav-inner{height:64px;min-height:64px;flex-wrap:nowrap;padding-top:0}
}
.form-note{font-size:.73rem;color:#59595e;line-height:1.7;margin:16px 0 24px}
.enquiry-card .btn{width:100%;padding:17px 16px}
.enquiry-result{border-top:1px solid #b5b5b5;margin-top:24px;padding-top:20px;font-size:.84rem}
.enquiry-result p{margin-bottom:12px}
.faq-section{border-top:1px solid var(--line)}
.faq-layout{display:grid;grid-template-columns:1fr 1.6fr;gap:80px}
.faq-list{border-top:1px solid var(--black)}
details{border-bottom:1px solid var(--line);padding:0 4px}
summary{display:flex;justify-content:space-between;gap:24px;align-items:center;list-style:none;padding:24px 0;font-family:Archivo,sans-serif;font-size:1rem;font-weight:600;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-weight:400;font-size:1.4rem;flex-shrink:0;transition:transform .25s}
details[open] summary:after{transform:rotate(45deg)}
details p{padding:0 30px 24px 0;font-size:.9rem;color:var(--grey);line-height:1.8}
.footer-policies{display:flex;gap:20px 28px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line-dark);padding:28px 0 0;margin-top:28px;font-size:.75rem;color:#b8b8b8}
.footer-policies a{text-decoration:none}
.footer-policies a:hover{text-decoration:underline;text-underline-offset:4px}
.cookie-banner{position:fixed;z-index:300;bottom:20px;left:20px;right:20px;max-width:1320px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow-y:auto;overscroll-behavior:contain;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:28px;background:white;border:1px solid #b5b5b5;box-shadow:0 10px 50px #0002;border-radius:var(--r-md);padding:22px 26px}
.cookie-banner .eyebrow{margin-bottom:6px;color:var(--black)}
.cookie-banner p:not(.eyebrow){font-size:.78rem;max-width:620px;color:#59595e}
.cookie-actions{display:flex;gap:10px;flex-shrink:0}
.cookie-actions .btn{font-size:.63rem;letter-spacing:.08em;padding:13px 18px}
.policy-hero{padding:150px 40px 64px;max-width:1440px;margin:auto;border-bottom:1px solid var(--line)}
.policy-hero .eyebrow{color:var(--grey)}
.policy-hero h1{font-size:clamp(2.8rem,7vw,6rem);line-height:.98;font-weight:900;text-transform:uppercase;letter-spacing:-.03em;margin-bottom:30px}
.policy-hero>p:last-child{max-width:630px;color:var(--grey)}
.policy-layout{max-width:1440px;margin:auto;padding:64px 40px 100px;display:grid;grid-template-columns:260px minmax(0,740px);gap:80px}
.policy-toc{align-self:start;position:sticky;top:100px}
.policy-toc ul{list-style:none}
.policy-toc li{margin-bottom:14px}
.policy-toc a{font-size:.84rem;text-underline-offset:4px}
.policy-content section{padding:0 0 36px;margin:0 0 36px;border-bottom:1px solid var(--line)}
.policy-content h2{font-size:1.35rem;text-transform:uppercase;letter-spacing:-.02em;line-height:1.2;margin-bottom:18px}
.policy-content p,.policy-content li{font-size:.93rem;line-height:1.85;color:#59595e}
.policy-content p+p{margin-top:16px}
.policy-content ul{padding-left:20px;margin-top:16px}
.policy-content a{text-underline-offset:4px}
.policy-content .text-button{color:var(--black);font-weight:600}
.policy-contact{padding:28px;background:var(--off);border-radius:var(--r-md)}
.policy-contact h2{margin-bottom:14px}
html[data-motion="paused"]{scroll-behavior:auto}
html[data-motion="paused"] *,html[data-motion="paused"] *:before,html[data-motion="paused"] *:after{animation-play-state:paused!important;transition:none!important}
html[data-motion="paused"] .reveal.animate{opacity:1;transform:none}
html[data-motion="paused"] .plane{display:none}
@media(min-width:901px){.burger{display:none!important}}
@media(max-width:1100px){.order-layout,.faq-layout{gap:40px}.nav-links{gap:18px}.nav-links a{letter-spacing:.1em}.nav-call{padding:11px 18px}}
@media(max-width:900px){
  .burger{width:44px;min-height:44px;align-items:center;justify-content:center;flex-shrink:0}
  .nav-links{gap:0;overscroll-behavior:contain}
  .nav-links.open{max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);overflow-y:auto}
  .nav-links a:after{display:none}
  html:not(.nav-ready) .nav-inner{height:auto;min-height:64px;flex-wrap:wrap;padding-top:16px}
  html:not(.nav-ready) .nav-links{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;width:100%;gap:0}
  html:not(.nav-ready) .nav-links li{border:0}
  html:not(.nav-ready) .nav-links a{padding:12px 12px 12px 0;font-size:.65rem}
  .nav-ready .nav-links{visibility:hidden;transition:max-height .35s ease,visibility .35s}
  .nav-ready .nav-links.open{visibility:visible}
  .hero-meta{margin-top:42px}
  .motion-bar{padding:16px 20px}
  .order-layout,.faq-layout{grid-template-columns:1fr}
  .cookie-banner{align-items:stretch;gap:16px;flex-direction:column;left:12px;right:12px;bottom:12px;padding:20px}
  .cookie-actions .btn{flex:1;text-align:center}
  .policy-hero{padding:130px 20px 48px}
  .policy-layout{padding:40px 20px 64px;grid-template-columns:1fr;gap:40px}
  .policy-toc{position:static}
  .policy-toc ul{display:flex;gap:12px 24px;flex-wrap:wrap}
  .policy-toc li{margin:0}
  .footer-policies a,.footer-policies .text-button,.motion-bar .text-button{display:inline-flex;align-items:center;min-height:44px}
  .f-col li{margin-bottom:0}
  .f-col li a{display:inline-block;padding:10px 0;min-height:44px}
}
@media(max-width:600px){
  .hero-meta{font-size:.6rem;gap:14px}
  .hero-meta a{width:100%}
  .enquiry-card{padding:28px 22px}
  .order-layout,.faq-layout{gap:32px}
  .motion-bar{padding:14px 18px;font-size:.64rem}
  .btn{letter-spacing:.1em}
  .ws-points li{gap:16px;font-size:.75rem}
  .ws-points li span{text-align:right}
  .cookie-actions{gap:8px}
  .cookie-actions .btn{padding:12px 10px}
  .footer-policies{gap:16px 24px}
}
@media(max-width:360px){
  .hero h1{font-size:14vw}
  .sec-label h2{font-size:1.5rem}
  .big-call a{font-size:clamp(1.6rem,9vw,2.2rem)}
  .hero-cta{flex-direction:column}
  .hero-cta .btn{width:100%;min-height:48px}
  .brand{font-size:.9rem;letter-spacing:.12em}
  .cookie-actions{flex-wrap:wrap}
  .cookie-actions .btn{min-width:110px;min-height:44px}
  .policy-hero h1{font-size:clamp(2rem,12vw,2.8rem)}
}
@media(prefers-reduced-motion:reduce){
  html:not([data-motion="playing"]){scroll-behavior:auto}
  html:not([data-motion="playing"]) *,html:not([data-motion="playing"]) *:before,html:not([data-motion="playing"]) *:after{animation:none!important;transition:none!important}
  html:not([data-motion="playing"]) .reveal.animate{opacity:1;transform:none}
  html:not([data-motion="playing"]) .plane{display:none}
}
@media print{
  nav,.cookie-banner,.motion-bar,.marquee,.hero-cta,.enquiry-card,.footer-policies button{display:none!important}
  .hero,.policy-hero{min-height:0;padding-top:30px}
  .reveal.animate{opacity:1;transform:none}
  .policy-layout{display:block}
  .policy-toc{position:static;margin-bottom:30px}
  .dark,footer{background:white;color:black}
  a{color:inherit}
}
</style>
